<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Pause admission, finish the active cycle</title><desc id="desc">A human moves the Epic out of In Progress. That is not a cancellation request.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8294A1"/></marker></defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172B3A;font-size:22px} .small{font-size:18px;fill:#526573} .label{font-size:19px;fill:#526573} .node-title{font-size:25px;font-weight:600} .big{font-size:40px;font-weight:600} .kicker{font-size:16px;font-weight:600;letter-spacing:2px;fill:#087F7C} .section{font-size:18px;font-weight:600;letter-spacing:1px;fill:#526573} .edge{fill:none;stroke:#8294A1;stroke-width:2;marker-end:url(#arrow)} .edge-label{font-size:18px;paint-order:stroke;stroke:#F7F9FC;stroke-width:9px;stroke-linejoin:round} </style><rect width="1600" height="900" fill="#F7F9FC"/><text x="55" y="48" class="kicker" text-anchor="start">PIGBOARD / ARCHITECTURE REVIEW</text><text x="55" y="108" class="big" text-anchor="start">Pause admission, finish the active cycle</text><text x="55" y="153" class="small" text-anchor="start">A human moves the Epic out of In Progress. That is not a cancellation request.</text><text x="55" y="867" class="small" text-anchor="start">RATIFIED TARGET · 14 NOV 2026 · Not deployed</text><text x="1545" y="867" class="small" text-anchor="end">Agreed workflow • proposed implementation</text><rect x="55" y="235" width="345" height="150" rx="15" fill="#F1EAF8" stroke="#D6DFE6"/><text x="79" y="274" class="node-title" text-anchor="start">Epic is no longer active</text><text x="79" y="313" class="small" text-anchor="start">No further admission</text><text x="79" y="341" class="small" text-anchor="start">Current cycle may finish</text><rect x="545" y="235" width="1000" height="150" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="569" y="274" class="node-title" text-anchor="start">A continues: implement → review → QA</text><text x="569" y="313" class="small" text-anchor="start">No corrections → Human Review</text><text x="569" y="341" class="small" text-anchor="start">No replacement run and no interruption of the current cycle</text><polyline points="400,310 545,310" class="edge"/><text x="472" y="290" class="edge-label" text-anchor="middle">Drain A</text><rect x="55" y="560" width="345" height="155" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="79" y="599" class="node-title" text-anchor="start">B and C wait</text><text x="79" y="638" class="small" text-anchor="start">Even when Ready to Work</text><text x="79" y="666" class="small" text-anchor="start">No new automated cycle</text><rect x="545" y="560" width="450" height="155" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="569" y="599" class="node-title" text-anchor="start">A needs corrections</text><text x="569" y="638" class="small" text-anchor="start">Move to Rework Queued</text><text x="569" y="666" class="small" text-anchor="start">No repair starts while Epic is paused</text><rect x="1095" y="560" width="450" height="155" rx="15" fill="#FCECEF" stroke="#D6DFE6"/><text x="1119" y="599" class="node-title" text-anchor="start">A needs human help</text><text x="1119" y="638" class="small" text-anchor="start">Move to Blocked</text><text x="1119" y="666" class="small" text-anchor="start">Human intervention still required</text><polyline points="790,385 790,560" class="edge"/><text x="790" y="484" class="edge-label" text-anchor="middle">Confirmed repair</text><polyline points="1320,385 1320,560" class="edge"/><text x="1320" y="484" class="edge-label" text-anchor="middle">Cannot proceed</text><text x="55" y="798" class="small" text-anchor="start">Restart the Epic → re-evaluate readiness, priority, dependencies and capacity. Never launch the whole queue.</text></svg>