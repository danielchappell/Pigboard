<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Workers own evidence and handoffs</title><desc id="desc">Only the manager moves work into In Progress. Worker skills decide their own evidence-backed outcomes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8294A1"/></marker></defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172B3A;font-size:22px} .small{font-size:18px;fill:#526573} .label{font-size:19px;fill:#526573} .node-title{font-size:25px;font-weight:600} .big{font-size:40px;font-weight:600} .kicker{font-size:16px;font-weight:600;letter-spacing:2px;fill:#087F7C} .section{font-size:18px;font-weight:600;letter-spacing:1px;fill:#526573} .edge{fill:none;stroke:#8294A1;stroke-width:2;marker-end:url(#arrow)} .edge-label{font-size:18px;paint-order:stroke;stroke:#F7F9FC;stroke-width:9px;stroke-linejoin:round} </style><rect width="1600" height="900" fill="#F7F9FC"/><text x="55" y="48" class="kicker" text-anchor="start">PIGBOARD / ARCHITECTURE REVIEW</text><text x="55" y="108" class="big" text-anchor="start">Workers own evidence and handoffs</text><text x="55" y="153" class="small" text-anchor="start">Only the manager moves work into In Progress. Worker skills decide their own evidence-backed outcomes.</text><text x="55" y="867" class="small" text-anchor="start">RATIFIED TARGET · 14 NOV 2026 · Not deployed</text><text x="1545" y="867" class="small" text-anchor="end">Agreed workflow • proposed implementation</text><rect x="55" y="245" width="305" height="200" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="79" y="284" class="node-title" text-anchor="start">In Progress</text><text x="79" y="323" class="small" text-anchor="start">Implementer</text><text x="79" y="351" class="small" text-anchor="start">Plan → one independent review</text><text x="79" y="379" class="small" text-anchor="start">Build PR → required CI passes</text><rect x="450" y="245" width="305" height="200" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="474" y="284" class="node-title" text-anchor="start">In Review</text><text x="474" y="323" class="small" text-anchor="start">PR reviewer</text><text x="474" y="351" class="small" text-anchor="start">Requirements + actual PR</text><text x="474" y="379" class="small" text-anchor="start">Shared criteria + comments</text><rect x="845" y="245" width="305" height="200" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="869" y="284" class="node-title" text-anchor="start">QA</text><text x="869" y="323" class="small" text-anchor="start">QA worker</text><text x="869" y="351" class="small" text-anchor="start">Named skills + ticket cases</text><text x="869" y="379" class="small" text-anchor="start">Retained execution evidence</text><rect x="1240" y="245" width="305" height="200" rx="15" fill="#F1EAF8" stroke="#D6DFE6"/><text x="1264" y="284" class="node-title" text-anchor="start">Human Review</text><text x="1264" y="323" class="small" text-anchor="start">Developer + human QA</text><text x="1264" y="351" class="small" text-anchor="start">Open PR, ready for humans</text><text x="1264" y="379" class="small" text-anchor="start">Merge / retarget owned here</text><polyline points="360,345 450,345" class="edge"/><text x="405" y="325" class="edge-label" text-anchor="middle">CI passes</text><polyline points="755,345 845,345" class="edge"/><text x="800" y="325" class="edge-label" text-anchor="middle">Approve</text><polyline points="1150,345 1240,345" class="edge"/><text x="1195" y="325" class="edge-label" text-anchor="middle">QA passes</text><rect x="55" y="625" width="420" height="145" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="79" y="664" class="node-title" text-anchor="start">Rework Queued</text><text x="79" y="703" class="small" text-anchor="start">Confirmed fix or known queued upstream repair</text><text x="79" y="731" class="small" text-anchor="start">End the run; manager admits repairs in order</text><rect x="645" y="625" width="400" height="145" rx="15" fill="#FCECEF" stroke="#D6DFE6"/><text x="669" y="664" class="node-title" text-anchor="start">Blocked</text><text x="669" y="703" class="small" text-anchor="start">Scope, access or decision needs a human</text><text x="669" y="731" class="small" text-anchor="start">End the run; no automatic recovery</text><polyline points="603,445 603,540 265,540 265,625" class="edge"/><text x="365" y="528" class="edge-label" text-anchor="middle">Reviewer / QA: confirmed repair</text><polyline points="998,445 998,540 603,540" class="edge"/><polyline points="205,445 205,485 35,485 35,698 55,698" class="edge"/><text x="205" y="474" class="edge-label" text-anchor="middle">Known upstream repair</text><polyline points="1110,445 1110,580 845,580 845,625" class="edge"/><text x="880" y="568" class="edge-label" text-anchor="middle">Any worker: needs human intervention</text><text x="1180" y="650" class="small" text-anchor="start">Discussion alone:</text><text x="1180" y="677" class="small" text-anchor="start">stay in the current stage.</text><text x="1180" y="704" class="small" text-anchor="start">Blocked is not a retry loop.</text></svg>