<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">One delivery loop</title><desc id="desc">Jira holds the work. The manager coordinates it. Cursor workers do it. Humans decide what ships.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8294A1"/></marker></defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172B3A;font-size:22px} .small{font-size:18px;fill:#526573} .label{font-size:19px;fill:#526573} .node-title{font-size:25px;font-weight:600} .big{font-size:40px;font-weight:600} .kicker{font-size:16px;font-weight:600;letter-spacing:2px;fill:#087F7C} .section{font-size:18px;font-weight:600;letter-spacing:1px;fill:#526573} .edge{fill:none;stroke:#8294A1;stroke-width:2;marker-end:url(#arrow)} .edge-label{font-size:18px;paint-order:stroke;stroke:#F7F9FC;stroke-width:9px;stroke-linejoin:round} </style><rect width="1600" height="900" fill="#F7F9FC"/><text x="55" y="48" class="kicker" text-anchor="start">PIGBOARD / ARCHITECTURE REVIEW</text><text x="55" y="108" class="big" text-anchor="start">One delivery loop</text><text x="55" y="153" class="small" text-anchor="start">Jira holds the work. The manager coordinates it. Cursor workers do it. Humans decide what ships.</text><text x="55" y="867" class="small" text-anchor="start">RATIFIED TARGET · 14 NOV 2026 · Not deployed</text><text x="1545" y="867" class="small" text-anchor="end">Agreed workflow • proposed implementation</text><rect x="55" y="265" width="225" height="165" rx="15" fill="#F1EAF8" stroke="#D6DFE6"/><text x="79" y="304" class="node-title" text-anchor="start">People</text><text x="79" y="343" class="small" text-anchor="start">Prepare tickets</text><text x="79" y="371" class="small" text-anchor="start">Start / pause Epics</text><text x="79" y="399" class="small" text-anchor="start">Review the results</text><rect x="345" y="265" width="280" height="165" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="369" y="304" class="node-title" text-anchor="start">Jira</text><text x="369" y="343" class="small" text-anchor="start">Epic + workstream order</text><text x="369" y="371" class="small" text-anchor="start">Requirements + cases</text><text x="369" y="399" class="small" text-anchor="start">Status + evidence links</text><rect x="720" y="250" width="315" height="195" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="744" y="289" class="node-title" text-anchor="start">Manager</text><text x="744" y="328" class="small" text-anchor="start">Admit the next ticket</text><text x="744" y="356" class="small" text-anchor="start">Dispatch the right worker</text><text x="744" y="384" class="small" text-anchor="start">Observe the run</text><text x="744" y="425" class="kicker" text-anchor="start">PROPOSED MANAGER</text><rect x="1150" y="250" width="395" height="195" rx="15" fill="#FFFFFF" stroke="#D6DFE6"/><text x="1174" y="289" class="node-title" text-anchor="start">Cursor workers</text><text x="1174" y="328" class="small" text-anchor="start">Implementer · PR reviewer · QA</text><text x="1174" y="356" class="small" text-anchor="start">Prepared skills + environment</text><text x="1174" y="384" class="small" text-anchor="start">One automated cycle / stream</text><polyline points="280,315 345,315" class="edge"/><text x="312" y="295" class="edge-label" text-anchor="middle">Prepare</text><polyline points="625,300 720,300" class="edge"/><text x="672" y="280" class="edge-label" text-anchor="middle">Events</text><polyline points="720,400 625,400" class="edge"/><text x="672" y="380" class="edge-label" text-anchor="middle">Admit</text><polyline points="1035,300 1150,300" class="edge"/><text x="1092" y="280" class="edge-label" text-anchor="middle">Launch</text><polyline points="1150,400 1035,400" class="edge" stroke-dasharray="7 5"/><text x="1092" y="380" class="edge-label" text-anchor="middle">Run status</text><polyline points="1310,445 1310,520 490,520 490,430" class="edge"/><text x="870" y="509" class="edge-label" text-anchor="middle">Worker: evidence + permitted Jira transition</text><rect x="1150" y="610" width="395" height="150" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="1174" y="649" class="node-title" text-anchor="start">Application PR + CI</text><text x="1174" y="688" class="small" text-anchor="start">Code, review comments, test evidence</text><text x="1174" y="716" class="small" text-anchor="start">Pipeline publishes the PR environment</text><polyline points="1430,445 1430,610" class="edge"/><text x="1490" y="570" class="edge-label" text-anchor="middle">Work on PR</text><rect x="55" y="610" width="570" height="150" rx="15" fill="#F1EAF8" stroke="#D6DFE6"/><text x="79" y="649" class="node-title" text-anchor="start">Human Review → UAT → production</text><text x="79" y="688" class="small" text-anchor="start">Humans own merge order, retargeting and acceptance.</text><text x="79" y="716" class="small" text-anchor="start">Human approval / unblock requests use automation.</text><polyline points="1150,700 625,700" class="edge"/><text x="888" y="688" class="edge-label" text-anchor="middle">Humans review and merge</text><text x="720" y="795" class="small" text-anchor="start">Solid arrows: work / handoff. Dashed: status observation only.</text></svg>