<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Repair the stack without interrupting work</title><desc id="desc">A has a confirmed defect. B is already running on top of A. C has not started.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8294A1"/></marker></defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172B3A;font-size:22px} .small{font-size:18px;fill:#526573} .label{font-size:19px;fill:#526573} .node-title{font-size:25px;font-weight:600} .big{font-size:40px;font-weight:600} .kicker{font-size:16px;font-weight:600;letter-spacing:2px;fill:#087F7C} .section{font-size:18px;font-weight:600;letter-spacing:1px;fill:#526573} .edge{fill:none;stroke:#8294A1;stroke-width:2;marker-end:url(#arrow)} .edge-label{font-size:18px;paint-order:stroke;stroke:#F7F9FC;stroke-width:9px;stroke-linejoin:round} </style><rect width="1600" height="900" fill="#F7F9FC"/><text x="55" y="48" class="kicker" text-anchor="start">PIGBOARD / ARCHITECTURE REVIEW</text><text x="55" y="108" class="big" text-anchor="start">Repair the stack without interrupting work</text><text x="55" y="153" class="small" text-anchor="start">A has a confirmed defect. B is already running on top of A. C has not started.</text><text x="55" y="867" class="small" text-anchor="start">RATIFIED TARGET · 14 NOV 2026 · Not deployed</text><text x="1545" y="867" class="small" text-anchor="end">Agreed workflow • proposed implementation</text><rect x="55" y="255" width="305" height="215" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="79" y="294" class="node-title" text-anchor="start">1  Queue A’s repair</text><text x="79" y="333" class="small" text-anchor="start">A → Rework Queued</text><text x="79" y="361" class="small" text-anchor="start">Record the finding on A</text><text x="79" y="389" class="small" text-anchor="start">Link the dependency from B</text><rect x="450" y="255" width="305" height="215" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="474" y="294" class="node-title" text-anchor="start">2  Let B finish</text><text x="474" y="333" class="small" text-anchor="start">Finish its existing cycle</text><text x="474" y="361" class="small" text-anchor="start">Or queue if A prevents testing</text><text x="474" y="389" class="small" text-anchor="start">Do not repair A inside B</text><rect x="845" y="255" width="305" height="215" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="869" y="294" class="node-title" text-anchor="start">3  Repair A first</text><text x="869" y="333" class="small" text-anchor="start">Manager admits A</text><text x="869" y="361" class="small" text-anchor="start">Fix A on its existing PR</text><text x="869" y="389" class="small" text-anchor="start">Review + QA again</text><rect x="1240" y="255" width="305" height="215" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="1264" y="294" class="node-title" text-anchor="start">4  Update B next</text><text x="1264" y="333" class="small" text-anchor="start">Manager admits B’s update</text><text x="1264" y="361" class="small" text-anchor="start">Incorporate repaired A</text><text x="1264" y="389" class="small" text-anchor="start">Review + QA again</text><polyline points="360,362 450,362" class="edge"/><polyline points="755,362 845,362" class="edge"/><polyline points="1150,362 1240,362" class="edge"/><rect x="55" y="605" width="650" height="150" rx="15" fill="#FFFFFF" stroke="#D6DFE6"/><text x="79" y="644" class="node-title" text-anchor="start">Each run owns one Story and one PR</text><text x="79" y="683" class="small" text-anchor="start">The original fix belongs in A. B incorporates it.</text><text x="79" y="711" class="small" text-anchor="start">B-specific adjustments stay in B; no two-PR implementer run.</text><rect x="845" y="605" width="700" height="150" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="869" y="644" class="node-title" text-anchor="start">C waits until the affected stack is repaired</text><text x="869" y="683" class="small" text-anchor="start">Queued repairs / updates precede ready Bugs and Stories.</text><text x="869" y="711" class="small" text-anchor="start">Known repair wait → Rework Queued. Human decision → Blocked.</text><polyline points="1392,470 1392,605" class="edge"/><text x="1392" y="545" class="edge-label" text-anchor="middle">Then continue oldest first</text></svg>