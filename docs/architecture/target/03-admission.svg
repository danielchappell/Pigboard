<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Admit only the next eligible ticket</title><desc id="desc">Eligibility comes before priority. Epic membership never makes an unready ticket executable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8294A1"/></marker></defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172B3A;font-size:22px} .small{font-size:18px;fill:#526573} .label{font-size:19px;fill:#526573} .node-title{font-size:25px;font-weight:600} .big{font-size:40px;font-weight:600} .kicker{font-size:16px;font-weight:600;letter-spacing:2px;fill:#087F7C} .section{font-size:18px;font-weight:600;letter-spacing:1px;fill:#526573} .edge{fill:none;stroke:#8294A1;stroke-width:2;marker-end:url(#arrow)} .edge-label{font-size:18px;paint-order:stroke;stroke:#F7F9FC;stroke-width:9px;stroke-linejoin:round} </style><rect width="1600" height="900" fill="#F7F9FC"/><text x="55" y="48" class="kicker" text-anchor="start">PIGBOARD / ARCHITECTURE REVIEW</text><text x="55" y="108" class="big" text-anchor="start">Admit only the next eligible ticket</text><text x="55" y="153" class="small" text-anchor="start">Eligibility comes before priority. Epic membership never makes an unready ticket executable.</text><text x="55" y="867" class="small" text-anchor="start">RATIFIED TARGET · 14 NOV 2026 · Not deployed</text><text x="1545" y="867" class="small" text-anchor="end">Agreed workflow • proposed implementation</text><rect x="55" y="220" width="370" height="155" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="79" y="259" class="node-title" text-anchor="start">1  Is admission open?</text><text x="79" y="298" class="small" text-anchor="start">AI-enabled Epic is In Progress</text><text x="79" y="326" class="small" text-anchor="start">Full numbered stream is identified</text><text x="79" y="354" class="small" text-anchor="start">One active Epic per full stream label</text><rect x="615" y="220" width="410" height="155" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="639" y="259" class="node-title" text-anchor="start">2  Is the stream available?</text><text x="639" y="298" class="small" text-anchor="start">No active implementation / review / QA</text><text x="639" y="326" class="small" text-anchor="start">No human blocker holding the stream</text><text x="639" y="354" class="small" text-anchor="start">No uncertain unfinished execution</text><polyline points="425,292 615,292" class="edge"/><text x="520" y="275" class="edge-label" text-anchor="middle">Yes</text><rect x="1175" y="220" width="370" height="155" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="1199" y="259" class="node-title" text-anchor="start">Wait</text><text x="1199" y="298" class="small" text-anchor="start">No new ticket is started</text><text x="1199" y="326" class="small" text-anchor="start">Keep queued work intact</text><text x="1199" y="354" class="small" text-anchor="start">No agent tokens for waiting</text><polyline points="1025,292 1175,292" class="edge"/><text x="1100" y="275" class="edge-label" text-anchor="middle">No</text><rect x="55" y="500" width="450" height="185" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="79" y="539" class="node-title" text-anchor="start">3  Build eligible candidates</text><text x="79" y="578" class="small" text-anchor="start">Rework Queued: understood repair / update</text><text x="79" y="606" class="small" text-anchor="start">Ready to Work: Bugs and Stories</text><text x="79" y="634" class="small" text-anchor="start">Ignore other preparation statuses</text><text x="79" y="662" class="small" text-anchor="start">Unmet prerequisites remain ineligible</text><polyline points="820,375 820,430 280,430 280,500" class="edge"/><text x="547" y="418" class="edge-label" text-anchor="middle">Yes</text><rect x="615" y="500" width="410" height="185" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="639" y="539" class="node-title" text-anchor="start">4  Choose the next item</text><text x="639" y="578" class="small" text-anchor="start">Required prerequisite first</text><text x="639" y="606" class="small" text-anchor="start">Then: rework → Bug → Story</text><text x="639" y="634" class="small" text-anchor="start">Use Epic order within each group</text><text x="639" y="662" class="small" text-anchor="start">At five in Human Review: no new ticket</text><polyline points="505,590 615,590" class="edge"/><text x="560" y="573" class="edge-label" text-anchor="middle">Filter</text><rect x="1175" y="500" width="370" height="185" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="1199" y="539" class="node-title" text-anchor="start">5  Start one ticket</text><text x="1199" y="578" class="small" text-anchor="start">Recheck current eligibility</text><text x="1199" y="606" class="small" text-anchor="start">Manager moves it to In Progress</text><text x="1199" y="634" class="small" text-anchor="start">The stage event dispatches implementer</text><polyline points="1025,590 1175,590" class="edge"/><text x="1100" y="573" class="edge-label" text-anchor="middle">Select</text><text x="55" y="768" class="small" text-anchor="start">An unready Bug does not hold a ready independent Story. A dependency can.</text><text x="55" y="795" class="small" text-anchor="start">Repair admission restores existing work; exact cap handling for unusual repair states remains a design check.</text></svg>