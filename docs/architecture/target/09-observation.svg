<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Observe execution; humans decide recovery</title><desc id="desc">Run state answers “is it active?” Worker evidence answers “did the job succeed?”</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8294A1"/></marker></defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172B3A;font-size:22px} .small{font-size:18px;fill:#526573} .label{font-size:19px;fill:#526573} .node-title{font-size:25px;font-weight:600} .big{font-size:40px;font-weight:600} .kicker{font-size:16px;font-weight:600;letter-spacing:2px;fill:#087F7C} .section{font-size:18px;font-weight:600;letter-spacing:1px;fill:#526573} .edge{fill:none;stroke:#8294A1;stroke-width:2;marker-end:url(#arrow)} .edge-label{font-size:18px;paint-order:stroke;stroke:#F7F9FC;stroke-width:9px;stroke-linejoin:round} </style><rect width="1600" height="900" fill="#F7F9FC"/><text x="55" y="48" class="kicker" text-anchor="start">PIGBOARD / ARCHITECTURE REVIEW</text><text x="55" y="108" class="big" text-anchor="start">Observe execution; humans decide recovery</text><text x="55" y="153" class="small" text-anchor="start">Run state answers “is it active?” Worker evidence answers “did the job succeed?”</text><text x="55" y="867" class="small" text-anchor="start">RATIFIED TARGET · 14 NOV 2026 · Not deployed</text><text x="1545" y="867" class="small" text-anchor="end">Proposed monitoring • existing automation API access unverified</text><rect x="55" y="230" width="400" height="155" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="79" y="269" class="node-title" text-anchor="start">Cursor run</text><text x="79" y="308" class="small" text-anchor="start">Known agent ID + run ID</text><text x="79" y="336" class="small" text-anchor="start">Read structured status / timestamps</text><text x="79" y="364" class="small" text-anchor="start">No full transcript collection</text><rect x="600" y="230" width="440" height="155" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="624" y="269" class="node-title" text-anchor="start">Manager observer</text><text x="624" y="308" class="small" text-anchor="start">Keep the last successful observation</text><text x="624" y="336" class="small" text-anchor="start">Compare terminal run with Jira handoff</text><text x="624" y="364" class="small" text-anchor="start">A failed read means unknown</text><rect x="1185" y="230" width="360" height="155" rx="15" fill="#FFFFFF" stroke="#D6DFE6"/><text x="1209" y="269" class="node-title" text-anchor="start">Compact run record</text><text x="1209" y="308" class="small" text-anchor="start">Ticket + stage visit + run</text><text x="1209" y="336" class="small" text-anchor="start">Observed state / time</text><text x="1209" y="364" class="small" text-anchor="start">Links to logs and evidence</text><polyline points="455,305 600,305" class="edge" stroke-dasharray="7 5"/><text x="528" y="285" class="edge-label" text-anchor="middle">Status read</text><polyline points="1040,305 1185,305" class="edge"/><text x="1110" y="285" class="edge-label" text-anchor="middle">Record</text><rect x="55" y="560" width="440" height="175" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="79" y="599" class="node-title" text-anchor="start">Active</text><text x="79" y="638" class="small" text-anchor="start">Stream remains occupied</text><text x="79" y="666" class="small" text-anchor="start">No change to ticket outcome</text><rect x="580" y="560" width="440" height="175" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="604" y="599" class="node-title" text-anchor="start">Ended + handoff exists</text><text x="604" y="638" class="small" text-anchor="start">Use the worker’s recorded outcome</text><text x="604" y="666" class="small" text-anchor="start">Normal scheduling rules apply</text><rect x="1105" y="560" width="440" height="175" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="1129" y="599" class="node-title" text-anchor="start">Missing / uncertain handoff</text><text x="1129" y="638" class="small" text-anchor="start">Human attention; stream stays held</text><text x="1129" y="666" class="small" text-anchor="start">Do not retry or infer success</text><polyline points="800,385 800,450 275,450 275,560" class="edge" stroke-dasharray="7 5"/><text x="275" y="510" class="edge-label" text-anchor="middle">Active</text><polyline points="800,385 800,450 800,450 800,560" class="edge" stroke-dasharray="7 5"/><text x="800" y="510" class="edge-label" text-anchor="middle">Ended</text><polyline points="800,385 800,450 1325,450 1325,560" class="edge" stroke-dasharray="7 5"/><text x="1325" y="510" class="edge-label" text-anchor="middle">Exception</text><text x="55" y="805" class="small" text-anchor="start">Duplicate dispatch: repeat of one stage visit → reuse its record. A later rework visit is a new execution.</text></svg>