<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Independent streams, shared worker types</title><desc id="desc">A numbered label is the capacity boundary. The suffix never selects a different worker automation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8294A1"/></marker></defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172B3A;font-size:22px} .small{font-size:18px;fill:#526573} .label{font-size:19px;fill:#526573} .node-title{font-size:25px;font-weight:600} .big{font-size:40px;font-weight:600} .kicker{font-size:16px;font-weight:600;letter-spacing:2px;fill:#087F7C} .section{font-size:18px;font-weight:600;letter-spacing:1px;fill:#526573} .edge{fill:none;stroke:#8294A1;stroke-width:2;marker-end:url(#arrow)} .edge-label{font-size:18px;paint-order:stroke;stroke:#F7F9FC;stroke-width:9px;stroke-linejoin:round} </style><rect width="1600" height="900" fill="#F7F9FC"/><text x="55" y="48" class="kicker" text-anchor="start">PIGBOARD / ARCHITECTURE REVIEW</text><text x="55" y="108" class="big" text-anchor="start">Independent streams, shared worker types</text><text x="55" y="153" class="small" text-anchor="start">A numbered label is the capacity boundary. The suffix never selects a different worker automation.</text><text x="55" y="867" class="small" text-anchor="start">RATIFIED TARGET · 14 NOV 2026 · Not deployed</text><text x="1545" y="867" class="small" text-anchor="end">Agreed workflow • proposed implementation</text><text x="55" y="225" class="section" text-anchor="start">FULL WORKSTREAM LABEL</text><text x="400" y="225" class="section" text-anchor="start">ONE ACTIVE AUTOMATED CYCLE</text><text x="1110" y="225" class="section" text-anchor="start">CURRENTLY WAITING · LIMIT 5</text><rect x="55" y="270" width="285" height="130" rx="15" fill="#F1EAF8" stroke="#D6DFE6"/><text x="79" y="309" class="node-title" text-anchor="start">AI-Daniel-1</text><text x="79" y="348" class="small" text-anchor="start">Epic A</text><rect x="400" y="270" width="580" height="130" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="424" y="309" class="node-title" text-anchor="start">Implementing Story A2</text><text x="424" y="348" class="small" text-anchor="start">Admit next only after A2 leaves cycle</text><rect x="1110" y="270" width="435" height="130" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="1134" y="309" class="node-title" text-anchor="start">2 / 5 waiting</text><text x="1134" y="348" class="small" text-anchor="start">Story and Bug tickets both count</text><polyline points="340,335 400,335" class="edge"/><polyline points="980,335 1110,335" class="edge"/><text x="1045" y="315" class="edge-label" text-anchor="middle">On pass</text><rect x="55" y="450" width="285" height="130" rx="15" fill="#F1EAF8" stroke="#D6DFE6"/><text x="79" y="489" class="node-title" text-anchor="start">AI-Maria-1</text><text x="79" y="528" class="small" text-anchor="start">Epic B</text><rect x="400" y="450" width="580" height="130" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="424" y="489" class="node-title" text-anchor="start">QA on Story B4</text><text x="424" y="528" class="small" text-anchor="start">When B4 passes, five are waiting</text><rect x="1110" y="450" width="435" height="130" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="1134" y="489" class="node-title" text-anchor="start">4 / 5 waiting</text><text x="1134" y="528" class="small" text-anchor="start">Story and Bug tickets both count</text><polyline points="340,515 400,515" class="edge"/><polyline points="980,515 1110,515" class="edge"/><text x="1045" y="495" class="edge-label" text-anchor="middle">On pass</text><rect x="55" y="630" width="285" height="130" rx="15" fill="#F1EAF8" stroke="#D6DFE6"/><text x="79" y="669" class="node-title" text-anchor="start">AI-Maria-2</text><text x="79" y="708" class="small" text-anchor="start">Epic C</text><rect x="400" y="630" width="580" height="130" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="424" y="669" class="node-title" text-anchor="start">No active cycle</text><text x="424" y="708" class="small" text-anchor="start">Ready Bug waits: capacity is full</text><rect x="1110" y="630" width="435" height="130" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="1134" y="669" class="node-title" text-anchor="start">5 / 5 waiting</text><text x="1134" y="708" class="small" text-anchor="start">Story and Bug tickets both count</text><polyline points="340,695 400,695" class="edge"/><text x="1045" y="702" class="small" text-anchor="middle">Held</text><text x="55" y="813" class="small" text-anchor="start">Illustrative snapshot. Streams may run independently; dependency and repository boundaries still apply.</text></svg>