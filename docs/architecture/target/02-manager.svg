<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Inside the manager</title><desc id="desc">Three responsibilities share a small execution record. These are modules, not three separate services.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8294A1"/></marker></defs><style>text {font-family:Arial,Helvetica,sans-serif;fill:#172B3A;font-size:22px} .small{font-size:18px;fill:#526573} .label{font-size:19px;fill:#526573} .node-title{font-size:25px;font-weight:600} .big{font-size:40px;font-weight:600} .kicker{font-size:16px;font-weight:600;letter-spacing:2px;fill:#087F7C} .section{font-size:18px;font-weight:600;letter-spacing:1px;fill:#526573} .edge{fill:none;stroke:#8294A1;stroke-width:2;marker-end:url(#arrow)} .edge-label{font-size:18px;paint-order:stroke;stroke:#F7F9FC;stroke-width:9px;stroke-linejoin:round} </style><rect width="1600" height="900" fill="#F7F9FC"/><text x="55" y="48" class="kicker" text-anchor="start">PIGBOARD / ARCHITECTURE REVIEW</text><text x="55" y="108" class="big" text-anchor="start">Inside the manager</text><text x="55" y="153" class="small" text-anchor="start">Three responsibilities share a small execution record. These are modules, not three separate services.</text><text x="55" y="867" class="small" text-anchor="start">RATIFIED TARGET · 14 NOV 2026 · Not deployed</text><text x="1545" y="867" class="small" text-anchor="end">Proposed architecture • API / storage choices open</text><rect x="55" y="230" width="255" height="160" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="79" y="269" class="node-title" text-anchor="start">Event intake</text><text x="79" y="308" class="small" text-anchor="start">Jira event / human request</text><text x="79" y="336" class="small" text-anchor="start">Read current ticket state</text><text x="79" y="364" class="small" text-anchor="start">Route by event purpose</text><rect x="430" y="230" width="450" height="160" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="454" y="269" class="node-title" text-anchor="start">Admission</text><text x="454" y="308" class="small" text-anchor="start">Epic, readiness, order and priority</text><text x="454" y="336" class="small" text-anchor="start">Stream occupancy + five-ticket cap</text><text x="454" y="364" class="small" text-anchor="start">Select one eligible ticket</text><rect x="1020" y="230" width="525" height="160" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="1044" y="269" class="node-title" text-anchor="start">Dispatch</text><text x="1044" y="308" class="small" text-anchor="start">Implementation / review / QA stage event</text><text x="1044" y="336" class="small" text-anchor="start">Check the record for this stage visit</text><text x="1044" y="364" class="small" text-anchor="start">Launch worker; retain its returned identity</text><polyline points="310,285 430,285" class="edge"/><text x="370" y="269" class="edge-label" text-anchor="middle">Evaluate</text><polyline points="310,355 365,355 365,450 1280,450 1280,390" class="edge"/><text x="820" y="438" class="edge-label" text-anchor="middle">Stage event → dispatch directly; do not re-admit the ticket</text><rect x="430" y="540" width="450" height="155" rx="15" fill="#EAF0FC" stroke="#D6DFE6"/><text x="454" y="579" class="node-title" text-anchor="start">Jira adapter</text><text x="454" y="618" class="small" text-anchor="start">Read authoritative fields / structured plan</text><text x="454" y="646" class="small" text-anchor="start">Admission writes In Progress</text><text x="454" y="674" class="small" text-anchor="start">Jira emits the resulting stage event</text><polyline points="655,390 655,540" class="edge"/><text x="760" y="501" class="edge-label" text-anchor="middle">Admission decision</text><rect x="1020" y="540" width="525" height="155" rx="15" fill="#E5F4F1" stroke="#D6DFE6"/><text x="1044" y="579" class="node-title" text-anchor="start">Observer + Cursor adapter</text><text x="1044" y="618" class="small" text-anchor="start">Read known run status; retain last observation</text><text x="1044" y="646" class="small" text-anchor="start">Ended without handoff → human attention</text><text x="1044" y="674" class="small" text-anchor="start">Unknown is not finished</text><polyline points="1370,390 1370,540" class="edge"/><text x="1440" y="495" class="edge-label" text-anchor="middle">Agent + run ID</text><rect x="55" y="540" width="255" height="155" rx="15" fill="#FFF3DC" stroke="#D6DFE6"/><text x="79" y="579" class="node-title" text-anchor="start">Human attention</text><text x="79" y="618" class="small" text-anchor="start">Uncertain launch</text><text x="79" y="646" class="small" text-anchor="start">Ended without handoff</text><text x="79" y="674" class="small" text-anchor="start">No automatic restart</text><polyline points="1020,655 940,655 940,755 175,755 175,695" class="edge"/><text x="650" y="745" class="edge-label" text-anchor="middle">Surface an exception; do not launch replacement work</text><text x="55" y="803" class="small" text-anchor="start">Shared record: ticket + stage visit + launch receipt + agent/run ID + observed state. Storage is undecided.</text></svg>