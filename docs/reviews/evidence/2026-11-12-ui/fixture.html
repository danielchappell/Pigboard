<!doctype html><html lang="en"><meta charset="utf-8"><title>Prescribed UI QA fixture</title><style>body{font:18px system-ui;background:#eef3f7;color:#172b3a;margin:0;padding:40px}main{background:white;max-width:650px;padding:32px;border-radius:12px}label,input,button{display:block;margin:16px 0}input{font:inherit;padding:8px}button{font:inherit;padding:10px 20px;background:#155c72;color:white;border:0;border-radius:6px}small{color:#46606c}#result{font-weight:bold;padding:16px;background:#eaf1f5}</style><main><h1>Save a display name</h1><small>Local synthetic fixture · revision ui-fixture-v1</small><p id="identity">Actor: Demo QA</p><div id="content"><form id="form"><label for="name">Display name</label><input id="name" name="name" required><button type="submit">Save name</button></form><p id="result" role="status">No name saved.</p></div></main><script>
const mode=new URLSearchParams(location.search).get('case');
if(mode==='blocked'){document.getElementById('identity').textContent='Test identity unavailable';document.getElementById('content').innerHTML='<h2>Sign-in required</h2><p>Your test session has expired. Ask the environment owner to restore access.</p>';}

</script></html>
