app = "pigboard-website"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "../../Dockerfile.website"
  ignorefile = "../../Dockerfile.website.dockerignore"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
