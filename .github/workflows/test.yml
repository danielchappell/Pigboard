name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  skills-and-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/aws/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix runtime/aws --ignore-scripts --no-audit --no-fund
      - run: npm test
