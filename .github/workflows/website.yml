name: Website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - run: node --test website/website.test.mjs
      - run: node --check website/app.js
      - run: node website/build.mjs
      - run: go test -race ./...
        working-directory: website
      - run: go vet ./...
        working-directory: website
